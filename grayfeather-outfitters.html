<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grayfeather Outfitters — QA Practice Shop</title>
<style>
  :root {
    --color-bg: #F7F3EC;
    --color-surface: #FFFFFF;
    --color-surface-raised: #FBF9F4;
    --color-text: #23281F;
    --color-text-muted: #5C6354;
    --color-primary: #2F4538;
    --color-primary-strong: #223328;
    --color-accent: #B5651D;
    --color-accent-strong: #944F17;
    --color-border: #DDD6C7;
    --color-danger: #A3362B;
    --color-danger-bg: #FBEAE7;
    --color-success: #3B7A45;
    --color-focus: #2F4538;
    --radius: 3px;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --color-bg: #F1EADA;
      --color-surface: #FFFFFF;
      --color-surface-raised: #FBF5E8;
      --color-text: #23281F;
      --color-text-muted: #5C6354;
      --color-primary: #2F4538;
      --color-primary-strong: #1C2A21;
      --color-accent: #B5651D;
      --color-accent-strong: #944F17;
      --color-border: #DDD2BC;
      --color-danger: #A3362B;
      --color-danger-bg: #FBEAE7;
      --color-success: #3B7A45;
      --color-focus: #2F4538;
      color-scheme: light;
    }
  }

  :root[data-theme="dark"] {
    --color-bg: #F1EADA;
    --color-surface: #FFFFFF;
    --color-surface-raised: #FBF5E8;
    --color-text: #23281F;
    --color-text-muted: #5C6354;
    --color-primary: #2F4538;
    --color-primary-strong: #1C2A21;
    --color-accent: #B5651D;
    --color-accent-strong: #944F17;
    --color-border: #DDD2BC;
    --color-danger: #A3362B;
    --color-danger-bg: #FBEAE7;
    --color-success: #3B7A45;
    --color-focus: #2F4538;
    color-scheme: light;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    min-height: 100%;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    background: var(--color-primary-strong);
    z-index: 10;
  }

  h1, h2, h3 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 600;
    line-height: 1.2;
    margin: 0 0 0.4em 0;
  }

  a { color: inherit; }

  button {
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
  }

  input, select {
    font-family: inherit;
    font-size: 0.95rem;
  }

  :focus-visible {
    outline: 2px solid var(--color-focus);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- layout shell ---------- */
  #app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

  .site-header {
    background: var(--color-primary-strong);
    color: #F7F3EC;
    padding-top: calc(0.9rem + env(safe-area-inset-top, 0px));
    padding-bottom: 0.9rem;
  }
  .site-header-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    text-decoration: none;
  }
  .brand-mark { font-size: 1.3rem; }
  .brand-name {
    font-family: Georgia, serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .header-actions { display: flex; align-items: center; gap: 0.75rem; }

  .cart-button {
    background: transparent;
    border: 1px solid rgba(247,243,236,0.4);
    color: #F7F3EC;
    border-radius: var(--radius);
    padding: 0.45rem 0.7rem;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    position: relative;
  }
  .cart-button:hover { background: rgba(247,243,236,0.08); }
  .cart-badge {
    background: var(--color-accent);
    color: #fff;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    min-width: 1.3em;
    height: 1.3em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 0.3em;
  }

  .menu-wrap { position: relative; }
  .menu-trigger {
    background: transparent;
    border: 1px solid rgba(247,243,236,0.4);
    color: #F7F3EC;
    border-radius: var(--radius);
    padding: 0.45rem 0.7rem;
  }
  .menu-trigger:hover { background: rgba(247,243,236,0.08); }
  .menu-panel {
    position: absolute;
    right: 0;
    top: calc(100% + 0.4rem);
    background: var(--color-surface);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    min-width: 190px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    overflow: hidden;
    z-index: 20;
  }
  .menu-panel button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 0.65rem 0.9rem;
    color: var(--color-text);
    font-size: 0.9rem;
  }
  .menu-panel button:hover { background: var(--color-surface-raised); }
  .menu-username {
    padding: 0.6rem 0.9rem;
    font-size: 0.8rem;
    color: var(--color-text-muted);
    border-bottom: 1px solid var(--color-border);
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 920px;
    margin: 0 auto;
    padding: 1.5rem 1.25rem 3rem;
  }

  .page-title { margin-bottom: 0.2rem; }
  .page-subtitle { color: var(--color-text-muted); margin-bottom: 1.5rem; }

  /* ---------- login ---------- */
  .login-wrap {
    max-width: 420px;
    margin: 2.5rem auto 0;
  }
  .login-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1.75rem;
  }
  .field { margin-bottom: 1.1rem; }
  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
  }
  .field input, .field select {
    width: 100%;
    padding: 0.55rem 0.65rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    background: var(--color-surface);
    color: var(--color-text);
  }
  .field-hint { font-size: 0.78rem; color: var(--color-text-muted); margin-top: 0.3rem; }
  .field-error { font-size: 0.8rem; color: var(--color-danger); margin-top: 0.3rem; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    border: none;
    border-radius: var(--radius);
    padding: 0.65rem 1.1rem;
    font-weight: 600;
    font-size: 0.92rem;
  }
  .btn-primary { background: var(--color-primary); color: #F7F3EC; }
  .btn-primary:hover:not(:disabled) { background: var(--color-primary-strong); }
  .btn-accent { background: var(--color-accent); color: #fff; }
  .btn-accent:hover:not(:disabled) { background: var(--color-accent-strong); }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--color-border);
    color: var(--color-text);
  }
  .btn-outline:hover:not(:disabled) { background: var(--color-surface-raised); }
  .btn-block { width: 100%; }

  .alert {
    border-radius: var(--radius);
    padding: 0.7rem 0.9rem;
    font-size: 0.88rem;
    margin-bottom: 1.1rem;
  }
  .alert-error { background: var(--color-danger-bg); color: var(--color-danger); }

  .forgot-link-wrap { margin: 0 0 1.1rem; font-size: 0.85rem; }
  .test-accounts {
    margin-top: 1.5rem;
    border-top: 1px dashed var(--color-border);
    padding-top: 1rem;
    font-size: 0.82rem;
    color: var(--color-text-muted);
  }
  .test-accounts h2 {
    font-family: inherit;
    font-size: 0.78rem;
    text-transform: none;
    font-weight: 700;
    color: var(--color-text);
    margin-bottom: 0.5rem;
  }
  .test-accounts table { border-collapse: collapse; width: 100%; }
  .test-accounts td { padding: 0.2rem 0.4rem 0.2rem 0; vertical-align: top; }
  .test-accounts code {
    background: var(--color-surface-raised);
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
  }

  /* ---------- toolbar / filters ---------- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 1.4rem;
    padding-bottom: 1.1rem;
    border-bottom: 1px solid var(--color-border);
  }
  .toolbar-group { display: flex; flex-direction: column; gap: 0.3rem; }
  .toolbar-group label { font-size: 0.78rem; font-weight: 600; color: var(--color-text-muted); }
  .search-group { flex: 1 1 220px; min-width: 200px; }
  .search-group input {
    width: 100%;
    padding: 0.45rem 0.65rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    background: var(--color-surface);
    color: var(--color-text);
  }
  .category-pills { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .pill {
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text);
    border-radius: 999px;
    padding: 0.35rem 0.8rem;
    font-size: 0.82rem;
  }
  .pill[aria-pressed="true"] {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: #F7F3EC;
  }
  .sort-select {
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    background: var(--color-surface);
    color: var(--color-text);
  }
  /* ---------- product list ---------- */
  .product-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 1.5rem;
  }
  .product-card {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    background: var(--color-surface);
    overflow: hidden;
  }
  .product-image {
    aspect-ratio: 4 / 3;
    background: var(--color-surface-raised);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .product-image svg { width: 72px; height: 72px; }
  .product-card-body {
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    flex: 1;
  }
  .product-category {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--color-primary);
  }
  .product-name { font-size: 1.05rem; margin-bottom: 0; }
  .link-reset {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    font: inherit;
    font-weight: 600;
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    text-align: left;
  }
  .link-reset:hover { color: var(--color-accent); }
  .product-rating { display: flex; align-items: center; gap: 0.35rem; margin: 0.1rem 0 0.3rem; }
  .rating-value { font-size: 0.78rem; color: var(--color-text-muted); }
  .product-desc {
    color: var(--color-text-muted);
    font-size: 0.88rem;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .product-card-footer {
    margin-top: auto;
    padding-top: 0.7rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .product-price { font-weight: 700; font-size: 1.05rem; }
  .product-action-btn { width: 100%; }
  .empty-state { color: var(--color-text-muted); padding: 2rem 0; text-align: center; }
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.7rem;
    margin-top: 2rem;
    flex-wrap: wrap;
  }
  .page-numbers { display: flex; gap: 0.3rem; flex-wrap: wrap; justify-content: center; }
  .page-number {
    min-width: 2.2rem;
    height: 2.2rem;
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text);
    border-radius: var(--radius);
    font-size: 0.85rem;
  }
  .page-number:hover:not([aria-current="page"]) { background: var(--color-surface-raised); }
  .page-number[aria-current="page"] {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: #F7F3EC;
    font-weight: 700;
  }

  .loading-row {
    padding: 2rem 0;
    color: var(--color-text-muted);
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .spinner {
    width: 1rem;
    height: 1rem;
    border: 2px solid var(--color-border);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- toast ---------- */
  #toast-region {
    position: fixed;
    top: calc(1rem + env(safe-area-inset-top, 0px));
    right: 1rem;
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .toast {
    background: var(--color-primary-strong);
    color: #F7F3EC;
    padding: 0.65rem 1rem;
    border-radius: var(--radius);
    font-size: 0.88rem;
    box-shadow: 0 6px 16px rgba(0,0,0,0.22);
  }

  /* ---------- product detail ---------- */
  .back-link {
    background: none;
    border: none;
    color: var(--color-text);
    font-size: 0.85rem;
    padding: 0;
    margin-bottom: 1.3rem;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .detail-layout { display: flex; gap: 2rem; flex-wrap: wrap; }
  .detail-icon {
    width: 140px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    flex-shrink: 0;
  }
  .detail-icon svg { width: 84px; height: 84px; }
  .detail-info { flex: 1; min-width: 240px; }
  .detail-price { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.8rem; }
  .detail-desc { color: var(--color-text-muted); margin-bottom: 1.4rem; max-width: 60ch; }
  .detail-specs { margin-bottom: 1.6rem; }
  .detail-specs h2 { font-size: 0.95rem; margin-bottom: 0.6rem; }
  .detail-specs dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.4rem 1.2rem; max-width: 420px; margin: 0; }
  .detail-specs dt { color: var(--color-text-muted); font-size: 0.85rem; }
  .detail-specs dd { margin: 0; font-size: 0.85rem; font-weight: 600; }

  /* ---------- cart ---------- */
  .cart-items { list-style: none; margin: 0 0 1.5rem; padding: 0; }
  .cart-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 7rem 7rem;
    align-items: center;
    gap: 1rem;
    padding: 1rem 0;
    border-bottom: 1px solid var(--color-border);
  }
  .cart-row-info { min-width: 0; }
  .cart-row-name { font-weight: 600; }
  .cart-row-price { color: var(--color-text-muted); font-size: 0.85rem; }
  .cart-row-total { text-align: right; }
  .cart-row-total-amount { margin-bottom: 0.2rem; }
  @media (max-width: 480px) {
    .cart-row { grid-template-columns: 1fr; row-gap: 0.6rem; }
    .cart-row-total { text-align: left; }
  }
  .qty-control { display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
  .qty-control button {
    width: 1.8rem;
    height: 1.8rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text);
    border-radius: var(--radius);
  }
  .qty-value { min-width: 1.4rem; text-align: center; font-weight: 600; }
  .remove-link {
    background: none;
    border: none;
    color: var(--color-danger);
    font-size: 0.82rem;
    text-decoration: underline;
    padding: 0;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.92rem;
    padding: 0.3rem 0;
  }
  .summary-total { font-weight: 700; font-size: 1.05rem; border-top: 1px solid var(--color-border); margin-top: 0.5rem; padding-top: 0.7rem; }

  /* ---------- checkout ---------- */
  .steps { display: flex; gap: 0.5rem; margin-bottom: 1.6rem; }
  .step-pill {
    flex: 1;
    text-align: center;
    padding: 0.5rem 0.4rem;
    border-radius: var(--radius);
    font-size: 0.78rem;
    font-weight: 600;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    color: var(--color-text-muted);
  }
  .step-pill[data-active="true"] {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: #F7F3EC;
  }
  .step-pill[data-done="true"] {
    background: var(--color-surface);
    border-color: var(--color-success);
    color: var(--color-success);
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-grid .span-2 { grid-column: 1 / -1; }
  @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

  .review-block {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1.1rem 1.2rem;
    margin-bottom: 1.1rem;
  }
  .review-block h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
  .review-block p { margin: 0.15rem 0; font-size: 0.9rem; color: var(--color-text-muted); }
  .promo-apply { margin: 1rem 0; padding-top: 0.9rem; border-top: 1px dashed var(--color-border); }
  .promo-input-row { display: flex; gap: 0.5rem; }
  .promo-input-row input {
    flex: 1;
    padding: 0.5rem 0.65rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    background: var(--color-surface);
    color: var(--color-text);
  }
  .promo-applied-msg { font-size: 0.88rem; margin: 0 0 0.3rem; color: var(--color-text); }
  .summary-discount { color: var(--color-success); }

  .actions-row { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; }

  .confirmation-wrap { max-width: 480px; margin: 2rem auto 0; text-align: center; }
  .confirmation-icon { font-size: 2.4rem; margin-bottom: 0.6rem; }
  .order-number {
    display: inline-block;
    background: var(--color-surface-raised);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 0.5rem 1rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    margin: 0.8rem 0 1.4rem;
  }

  /* ---------- order history ---------- */
  .order-table-wrap { overflow-x: auto; }
  .order-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .order-table th, .order-table td {
    text-align: left;
    padding: 0.7rem 1rem 0.7rem 0;
    border-bottom: 1px solid var(--color-border);
    white-space: nowrap;
  }
  .order-table td:nth-child(3) { white-space: normal; }
  .sort-header {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-weight: 700;
    color: var(--color-text);
    cursor: pointer;
  }
  .sort-header:hover { color: var(--color-accent); }
  .order-items-summary { font-size: 0.85rem; color: var(--color-text-muted); max-width: 36ch; }
  .order-items-summary div { margin: 0.15rem 0; }
  .order-discount-note { font-size: 0.78rem; color: var(--color-success); margin-top: 0.2rem; }

  /* ---------- promo popup ---------- */
  .promo-overlay {
    position: fixed;
    inset: 0;
    background: rgba(35, 40, 31, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    z-index: 40;
  }
  .promo-modal {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    max-width: 360px;
    width: 100%;
    padding: 1.75rem;
    position: relative;
    text-align: center;
  }
  .promo-close {
    position: absolute;
    top: 0.6rem;
    right: 0.6rem;
    background: none;
    border: none;
    font-size: 1.3rem;
    line-height: 1;

    for (var id in state.cart) { total += state.cart[id]; }

  function cartSubtotal() {
    var sum = 0;
    for (var id in state.cart) {
      var p = findProduct(id);
      if (p) sum += p.price * state.cart[id];
    }
    return sum;
  }

    var subtotal = cartSubtotal();
    var discount = state.promoApplied ? subtotal * PROMO_DISCOUNT_RATE : 0;
    return {
      subtotal: subtotal,
      discount: discount,
      shipping: SHIPPING_FEE,
      total: subtotal - discount + SHIPPING_FEE
    };
  }

    var region = document.getElementById("toast-region");
    var id = "toast-" + (++toastSeq);
    var node = document.createElement("div");
    node.className = "toast";
    node.setAttribute("role", "status");
    node.id = id;
    node.textContent = message;
    region.appendChild(node);
    setTimeout(function () {
      var n = document.getElementById(id);
      if (n) n.remove();
    }, 1800);
  }

    if (action === "go-cart") { state.view = "cart"; state.menuOpen = false; render(); return true; }
    if (action === "go-orders") { state.view = "orders"; state.menuOpen = false; render(); return true; }
    if (action === "toggle-menu") { state.menuOpen = !state.menuOpen; render(); return true; }
    if (action === "logout") { doLogout(); return true; }
    if (action === "reset-app") { doResetAppState(); return true; }
    if (action === "dismiss-promo") { state.promoVisible = false; render(); return true; }
    if (action === "go-forgot") { state.loginMode = "forgot"; state.loginError = null; render(); return true; }
    if (action === "back-to-login") { state.loginMode = "signin"; state.loginError = null; render(); return true; }
    if (action === "noop") { return true; }
    return false;

      setTimeout(function () {
        state.checkingProductId = null;
        state.productAvailability[checkId] = "in-stock";
        render();
      }, 1200);
      return true;
    }
    if (action === "add-to-cart") {
      var addId = btn.getAttribute("data-id");
      var product = findProduct(addId);
      if (product.availability === "out-of-stock") return true;
      state.addingProductId = addId;
      render();
      setTimeout(function () {
        state.addingProductId = null;
        state.cart[addId] = (state.cart[addId] || 0) + 1;
        render();
        showToast("Added " + product.name + " to cart");
      }, 400);
      return true;
    }
    return false;
  }

  function appClickHandler(e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");
    var id = btn.getAttribute("data-id");

    if (handleGlobalAction(action, btn)) return;

    if (action === "filter-all") {
      state.selectedCategories = [];
      state.page = 1;
      render();
      return;
    }
    if (action === "filter-toggle") {
      var cat = btn.getAttribute("data-category");
      var idx = state.selectedCategories.indexOf(cat);
      if (idx === -1) state.selectedCategories.push(cat);
      else state.selectedCategories.splice(idx, 1);
      state.page = 1;
      render();
      return;
    }
    if (action === "sort-orders") {
      var sortKey = btn.getAttribute("data-sort-key");
      if (state.orderSortKey === sortKey) {
        state.orderSortDir = state.orderSortDir === "asc" ? "desc" : "asc";
      } else {
        state.orderSortKey = sortKey;
        state.orderSortDir = "asc";
      }
      render();
      return;
    }
    if (action === "page-prev") { if (state.page > 1) state.page -= 1; render(); return; }
    if (action === "page-next") { state.page += 1; render(); return; }
    if (action === "page-goto") { state.page = parseInt(btn.getAttribute("data-page"), 10) || 1; render(); return; }

    if (action === "go-checkout") {
      if (Object.keys(state.cart).length === 0) return;
      state.view = "checkout";
      state.checkoutStep = 1;
      render();
      return;
    }
    if (action === "inc") { state.cart[id] += 1; render(); return; }
    if (action === "dec") {
      state.cart[id] -= 1;
      if (state.cart[id] <= 0) delete state.cart[id];
      render();
      return;
    }
    if (action === "remove") { delete state.cart[id]; render(); return; }

    if (action === "back-shipping") { state.checkoutStep = 1; render(); return; }
    if (action === "back-payment") { state.checkoutStep = 2; render(); return; }
    if (action === "remove-promo") {
      state.promoApplied = false;
      state.promoCode = "";
      state.promoError = null;
      render();
      return;
    }
    if (action === "place-order") {
      state.placingOrder = true;
      render();
      setTimeout(function () {
        state.placingOrder = false;
        state.orderNumber = "GF-" + Math.floor(100000 + Math.random() * 900000);
        var placedAt = new Date();
        var delivery = new Date();
        delivery.setDate(delivery.getDate() + 5);
        state.orderDate = delivery.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });

        var orderItems = Object.keys(state.cart).map(function (id) {
          var p = findProduct(id);
          return { name: p.name, qty: state.cart[id], price: p.price };
        });
        var placedTotals = orderTotals();
        state.orderHistory.push({
          orderNumber: state.orderNumber,
          placedAt: placedAt,
          items: orderItems,
          total: placedTotals.total,
          discountApplied: state.promoApplied,
          discountAmount: placedTotals.discount
        });

        state.view = "confirmation";
        render();
      }, 1600);
      return;
    }

    if (action === "continue-shopping") {
      state.cart = {};
      state.checkoutStep = 1;
      state.shipping = { fullName: "", address: "", city: "", state: "", zip: "" };
      state.payment = { cardName: "", cardNumber: "", expiry: "", cvv: "" };
      state.orderNumber = null;
      state.promoCode = "";
      state.promoApplied = false;
      state.promoError = null;
      state.view = "shop";
      window.location.hash = "";
      render();
      return;
    }

    handleProductAction(action, btn);
  }

  // A real custom element with its own shadow root: the star markup inside
  // is only reachable with a shadow-piercing locator, while the host
  // element's aria-label still gives an accessible-name based test an
  // equivalent way in.
  if (!customElements.get("gf-rating")) {
    customElements.define("gf-rating", class extends HTMLElement {
      static get observedAttributes() { return ["value"]; }
      connectedCallback() {
        if (!this.shadowRoot) this.attachShadow({ mode: "open" });
        this._render();
      }
      attributeChangedCallback() { if (this.shadowRoot) this._render(); }
      _render() {
        var value = parseFloat(this.getAttribute("value") || "0");
        var full = Math.floor(value);
        var half = (value - full) >= 0.5;
        var stars = "";
        for (var i = 0; i < 5; i++) {
          var cls = i < full ? "full" : (i === full && half ? "half" : "empty");
          stars += '<span class="star ' + cls + '">&#9733;</span>';
        }
        this.shadowRoot.innerHTML =
          '<style>' +
            ':host { display: inline-flex; align-items: center; }' +
            '.star { font-size: 0.85rem; line-height: 1; color: var(--color-border); }' +
            '.star.full { color: var(--color-accent); }' +
            '.star.half { color: var(--color-accent); opacity: 0.5; }' +
          '</style>' +
          '<span class="stars">' + stars + '</span>';
      }
    });
  }

  var RATING_STEPS = [3.5, 4, 4.5, 5];

  function productRating(p) {
    var hash = 0;
    for (var i = 0; i < p.id.length; i++) { hash = (hash * 31 + p.id.charCodeAt(i)) >>> 0; }
    return RATING_STEPS[hash % RATING_STEPS.length];
  }

    var rating = productRating(p);
    return "" +

        '<span class="rating-value">' + rating.toFixed(1) + '</span>' +
      '</div>';
  }

    var availability = p.availability === "out-of-stock"
      ? "out-of-stock"
      : (state.productAvailability[p.id] || (p.availability === "needs-check" ? "unchecked" : "in-stock"));
    var actionHtml;
    if (availability === "out-of-stock") {
      actionHtml = '<button type="button" class="btn btn-outline" disabled>Out of Stock</button>';
    } else if (p.id === state.checkingProductId) {
      actionHtml = '<button type="button" class="btn btn-outline" disabled><span class="spinner" aria-hidden="true"></span> Checking&hellip;</button>';
    } else if (availability === "unchecked") {
      actionHtml = '<button type="button" class="btn btn-outline" data-action="check-availability" data-id="' + p.id + '">Check availability</button>';
    } else if (p.id === state.addingProductId) {
      actionHtml = '<button type="button" class="btn btn-accent" disabled>Adding&hellip;</button>';
    } else {
      actionHtml = '<button type="button" class="btn btn-accent" data-action="add-to-cart" data-id="' + p.id + '">Add to Cart</button>';
    }

    var specsHtml = Object.keys(p.specs).map(function (key) {
      return '<dt>' + escapeHtml(key) + '</dt><dd>' + escapeHtml(p.specs[key]) + '</dd>';
    }).join("");

    return "" +
      renderHeader() +
      '<main>' +
        '<button type="button" class="back-link" data-action="go-shop">&larr; Back to shop</button>' +
        '<div class="detail-layout">' +
          '<div class="detail-icon" role="img" aria-label="' + escapeHtml(p.name) + ' illustration">' + (PRODUCT_ICONS[p.category] || "") + '</div>' +
          '<div class="detail-info">' +
            '<span class="product-category">' + escapeHtml(p.category) + '</span>' +
            '<h1>' + escapeHtml(p.name) + '</h1>' +
            renderRating(p) +
            '<p class="detail-price">' + formatMoney(p.price) + '</p>' +
            '<p class="detail-desc">' + escapeHtml(p.longDescription) + '</p>' +
            '<div class="detail-specs">' +
              '<h2>Specifications</h2>' +
              '<dl>' + specsHtml + '</dl>' +
            '</div>' +
            actionHtml +
          '</div>' +
        '</div>' +
      '</main>';
  }

  function bindProductDetail() {}

  /* ---------------- cart ---------------- */

  function renderCart() {
    var ids = Object.keys(state.cart);
    var bodyHtml;
    if (ids.length === 0) {
      bodyHtml = '<p class="empty-state">Your cart is empty.</p>';
    } else {
      bodyHtml = '<ul class="cart-items">' +
        ids.map(function (id) {
          var p = findProduct(id);
          var qty = state.cart[id];
          return "" +
            '<li class="cart-row">' +
              '<div class="cart-row-info">' +
                '<div class="cart-row-name">' + escapeHtml(p.name) + '</div>' +
                '<div class="cart-row-price">' + formatMoney(p.price) + ' each</div>' +
              '</div>' +
              '<div class="qty-control">' +
                '<button type="button" class="qty-btn" data-action="dec" data-id="' + id + '"><span aria-hidden="true">&minus;</span></button>' +
                '<span class="qty-value">' + qty + '</span>' +
                '<button type="button" class="qty-btn" data-action="inc" data-id="' + id + '"><span aria-hidden="true">+</span></button>' +
              '</div>' +
              '<div class="cart-row-total">' +
                '<div class="cart-row-total-amount">' + formatMoney(p.price * qty) + '</div>' +
                '<button type="button" class="remove-link" data-action="remove" data-id="' + id + '">Remove</button>' +
              '</div>' +
            '</li>';
        }).join("") +
        '</ul>';
    }

    var subtotal = cartSubtotal();
    var hasItems = ids.length > 0;

    return "" +
      renderHeader() +
      '<main>' +
        '<h1 class="page-title">Your cart</h1>' +
        bodyHtml +
        (hasItems ? ('<div class="summary-row"><span>Subtotal</span><span>' + formatMoney(subtotal) + '</span></div>') : "") +
        '<div class="actions-row">' +
          '<button type="button" class="btn btn-outline" data-action="go-shop">Continue shopping</button>' +
          '<button type="button" class="btn btn-primary" data-action="go-checkout" ' + (hasItems ? "" : "disabled") + '>Proceed to checkout</button>' +
        '</div>' +
      '</main>';
  }

  function bindCart() {}

  /* ---------------- checkout ---------------- */

  function shippingValid() {
    var s = state.shipping;
    return s.fullName.trim().length >= 2 &&
      s.address.trim().length >= 3 &&
      s.city.trim().length >= 2 &&
      s.state.length > 0 &&
      /^\d{5}$/.test(s.zip.trim());
  }

  function paymentValid() {
    var p = state.payment;
    return p.cardName.trim().length >= 2 &&
      /^\d{16}$/.test(p.cardNumber.replace(/\s/g, "")) &&
      /^(0[1-9]|1[0-2])\/\d{2}$/.test(p.expiry.replace(/\s/g, "")) &&
      /^\d{3}$/.test(p.cvv.trim());
  }

  function renderCheckout() {
    var stepsHtml = '<div class="steps" role="list" aria-label="Checkout steps">' +
      [1, 2, 3].map(function (n) {
        var label = n === 1 ? "Shipping" : n === 2 ? "Payment" : "Review";
        return '<div class="step-pill" role="listitem" data-active="' + (state.checkoutStep === n) + '" data-done="' + (state.checkoutStep > n) + '">' + n + '. ' + label + '</div>';
      }).join("") +
      '</div>';

    var content;
    if (state.checkoutStep === 1) content = renderShippingStep();
    else if (state.checkoutStep === 2) content = renderPaymentStep();
    else content = renderReviewStep();

    return "" +
      renderHeader() +
      '<main>' +
        '<h1 class="page-title">Checkout</h1>' +
        stepsHtml +
        content +
      '</main>';
  }

  function renderShippingStep() {
    var s = state.shipping;
    return "" +
      '<form id="shipping-form" novalidate>' +
        '<div class="form-grid">' +
          '<div class="field span-2">' +
            '<label for="fullName">Full name</label>' +
            '<input type="text" id="fullName" value="' + escapeHtml(s.fullName) + '">' +
          '</div>' +
          '<div class="field span-2">' +
            '<label for="address">Street address</label>' +
            '<input type="text" id="address" value="' + escapeHtml(s.address) + '">' +
          '</div>' +
          '<div class="field">' +
            '<label for="city">City</label>' +
            '<input type="text" id="city" value="' + escapeHtml(s.city) + '">' +
          '</div>' +
          '<div class="field">' +
            '<label for="state">State</label>' +
            '<select id="state">' +
              '<option value="">Select&hellip;</option>' +
              STATES.map(function (abbr) { return '<option value="' + abbr + '"' + (s.state === abbr ? " selected" : "") + '>' + abbr + '</option>'; }).join("") +
            '</select>' +
          '</div>' +
          '<div class="field">' +
            '<label for="zip">ZIP code</label>' +
            '<input type="text" id="zip" inputmode="numeric" value="' + escapeHtml(s.zip) + '">' +
            '<div class="field-hint">5 digits</div>' +
          '</div>' +
        '</div>' +
        '<div class="actions-row">' +
          '<button type="button" class="btn btn-outline" data-action="go-cart">Back to cart</button>' +
          '<button type="submit" class="btn btn-primary" id="continue-payment-btn" ' + (shippingValid() ? "" : "disabled") + '>Continue to payment</button>' +
        '</div>' +
      '</form>';
  }

  function renderPaymentStep() {
    var p = state.payment;
    return "" +
      '<form id="payment-form" novalidate>' +
        '<div class="form-grid">' +
          '<div class="field span-2">' +
            '<label for="cardName">Name on card</label>' +
            '<input type="text" id="cardName" value="' + escapeHtml(p.cardName) + '">' +
          '</div>' +
          '<div class="field span-2">' +
            '<label for="cardNumber">Card number</label>' +
            '<input type="text" id="cardNumber" inputmode="numeric" placeholder="1234 5678 9012 3456" value="' + escapeHtml(p.cardNumber) + '">' +
          '</div>' +
          '<div class="field">' +
            '<label for="expiry">Expiration (MM/YY)</label>' +
            '<input type="text" id="expiry" placeholder="08/27" value="' + escapeHtml(p.expiry) + '">' +
          '</div>' +
          '<div class="field">' +
            '<label for="cvv">CVV</label>' +
            '<input type="text" id="cvv" inputmode="numeric" value="' + escapeHtml(p.cvv) + '">' +
          '</div>' +
        '</div>' +
        '<div class="actions-row">' +
          '<button type="button" class="btn btn-outline" data-action="back-shipping">Back</button>' +
          '<button type="submit" class="btn btn-primary" id="continue-review-btn" ' + (paymentValid() ? "" : "disabled") + '>Review order</button>' +
        '</div>' +
      '</form>';
  }

  function renderReviewStep() {
    var ids = Object.keys(state.cart);
    var totals = orderTotals();
    var last4 = state.payment.cardNumber.replace(/\s/g, "").slice(-4);

    var promoHtml = state.promoApplied
      ? '<p class="promo-applied-msg">Code <strong>' + PROMO_CODE + '</strong> applied &mdash; 10% off.</p>' +
        '<button type="button" class="link-reset" data-action="remove-promo">Remove code</button>'
      : '<form id="promo-form" novalidate>' +
          '<div class="field">' +
            '<label for="promo-code">Promo code</label>' +
            '<div class="promo-input-row">' +
              '<input type="text" id="promo-code" placeholder="Enter code" value="' + escapeHtml(state.promoCode) + '">' +
              '<button type="submit" class="btn btn-outline">Apply</button>' +
            '</div>' +
            (state.promoError ? '<div class="field-error" role="alert">' + escapeHtml(state.promoError) + '</div>' : "") +
          '</div>' +
        '</form>';

    return "" +
      '<div class="review-block">' +
        '<h3>Shipping to</h3>' +
        '<p>' + escapeHtml(state.shipping.fullName) + '</p>' +
        '<p>' + escapeHtml(state.shipping.address) + '</p>' +
        '<p>' + escapeHtml(state.shipping.city) + ', ' + escapeHtml(state.shipping.state) + ' ' + escapeHtml(state.shipping.zip) + '</p>' +
      '</div>' +
      '<div class="review-block">' +
        '<h3>Payment</h3>' +
        '<p>Card ending in ' + escapeHtml(last4) + '</p>' +
      '</div>' +
      '<div class="review-block">' +
        '<h3>Order summary</h3>' +
        ids.map(function (id) {
          var p = findProduct(id);
          var qty = state.cart[id];
          return '<p>' + escapeHtml(p.name) + ' &times; ' + qty + ' &mdash; ' + formatMoney(p.price * qty) + '</p>';
        }).join("") +
        '<div class="promo-apply">' + promoHtml + '</div>' +
        '<div class="summary-row"><span>Subtotal</span><span>' + formatMoney(totals.subtotal) + '</span></div>' +
        (totals.discount > 0 ? '<div class="summary-row summary-discount"><span>Discount (10%)</span><span>&minus;' + formatMoney(totals.discount) + '</span></div>' : "") +
        '<div class="summary-row"><span>Shipping</span><span>' + formatMoney(totals.shipping) + '</span></div>' +
        '<div class="summary-row summary-total"><span>Total</span><span data-testid="order-total">' + formatMoney(totals.total) + '</span></div>' +
      '</div>' +
      '<div class="actions-row">' +
        '<button type="button" class="btn btn-outline" data-action="back-payment">Back</button>' +
        '<button type="button" class="btn btn-accent" id="place-order-btn" data-action="place-order" ' + (state.placingOrder ? "disabled" : "") + '>' +
          (state.placingOrder ? '<span class="spinner" aria-hidden="true"></span> Processing payment&hellip;' : "Place order") +
        '</button>' +
      '</div>';
  }

  function bindCheckout() {
    var shippingForm = document.getElementById("shipping-form");
    if (shippingForm) {
      ["fullName", "address", "city", "state", "zip"].forEach(function (field) {
        var input = document.getElementById(field);
        input.addEventListener("input", function () {
          state.shipping[field] = input.value;
          var btn = document.getElementById("continue-payment-btn");
          if (btn) btn.disabled = !shippingValid();
        });
      });
      shippingForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!shippingValid()) return;
        state.checkoutStep = 2;
        render();
      });
    }

    var paymentForm = document.getElementById("payment-form");
    if (paymentForm) {
      ["cardName", "cardNumber", "expiry", "cvv"].forEach(function (field) {
        var input = document.getElementById(field);
        input.addEventListener("input", function () {
          state.payment[field] = input.value;
          var btn = document.getElementById("continue-review-btn");
          if (btn) btn.disabled = !paymentValid();
        });
      });
      paymentForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!paymentValid()) return;
        state.checkoutStep = 3;
        render();
      });
    }

    var promoForm = document.getElementById("promo-form");
    if (promoForm) {
      promoForm.addEventListener("submit", function (e) {
        e.preventDefault();
        var entered = document.getElementById("promo-code").value.trim();
        state.promoCode = entered;
        if (entered.toUpperCase() === PROMO_CODE) {
          state.promoApplied = true;
          state.promoError = null;
        } else {
          state.promoApplied = false;
          state.promoError = "That code isn't valid.";
        }
        render();
      });
    }
  }

  /* ---------------- confirmation ---------------- */

  function renderConfirmation() {
    return "" +
      renderHeader() +
      '<main>' +
        '<div class="confirmation-wrap">' +
          '<div class="confirmation-icon" aria-hidden="true">&#127961;&#65039;</div>' +
          '<h1>Order confirmed</h1>' +
          '<p>Thanks, ' + escapeHtml(state.username || "") + '. Your gear is being packed at basecamp.</p>' +
          '<div class="order-number" data-testid="order-number">' + escapeHtml(state.orderNumber || "") + '</div>' +
          '<p>Estimated delivery: ' + escapeHtml(state.orderDate || "") + '</p>' +
          '<p style="margin-top:1.5rem;">' +
            '<button type="button" class="btn btn-primary" data-action="continue-shopping">Continue shopping</button>' +
          '</p>' +
        '</div>' +
      '</main>';
  }

  function bindConfirmation() {}

  /* ---------------- order history ---------------- */

  var ORDER_COLUMNS = [
    { key: "orderNumber", label: "Order #" },
    { key: "date", label: "Date" },
    { key: "itemCount", label: "Items" },
    { key: "total", label: "Total" }
  ];

  function sortedOrderHistory() {
    var list = state.orderHistory.slice();
    var key = state.orderSortKey;
    var dir = state.orderSortDir === "asc" ? 1 : -1;
    list.sort(function (a, b) {
      var av, bv;
      if (key === "orderNumber") { av = a.orderNumber; bv = b.orderNumber; }
      else if (key === "date") { av = a.placedAt.getTime(); bv = b.placedAt.getTime(); }
      else if (key === "itemCount") { av = a.items.reduce(function (s, i) { return s + i.qty; }, 0); bv = b.items.reduce(function (s, i) { return s + i.qty; }, 0); }
      else { av = a.total; bv = b.total; }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
    return list;
  }

  function renderOrderHistory() {
    var orders = sortedOrderHistory();
    var body;

    if (orders.length === 0) {
      body = '<p class="empty-state">No orders placed yet this session.</p>';
    } else {
      var headHtml = ORDER_COLUMNS.map(function (col) {
        var isActive = state.orderSortKey === col.key;
        var ariaSort = isActive ? (state.orderSortDir === "asc" ? "ascending" : "descending") : "none";
        var arrow = isActive ? (state.orderSortDir === "asc" ? " \u2191" : " \u2193") : "";
        return '<th aria-sort="' + ariaSort + '"><button type="button" class="sort-header" data-action="sort-orders" data-sort-key="' + col.key + '">' + escapeHtml(col.label) + arrow + '</button></th>';
      }).join("");

      var rowsHtml = orders.map(function (o) {
        var dateLabel = o.placedAt.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
        var itemsSummary = o.items.map(function (i) {
          return '<div>' + escapeHtml(i.name) + ' &times;' + i.qty + ' &mdash; ' + formatMoney(i.price * i.qty) + '</div>';
        }).join("");
        var discountNote = o.discountApplied
          ? '<div class="order-discount-note">' + formatMoney(o.discountAmount) + ' discount applied</div>'
          : "";
        return "" +
          '<tr data-testid="order-row-' + escapeHtml(o.orderNumber) + '">' +
            '<td data-testid="order-number-' + escapeHtml(o.orderNumber) + '">' + escapeHtml(o.orderNumber) + '</td>' +
            '<td data-testid="order-date-' + escapeHtml(o.orderNumber) + '">' + dateLabel + '</td>' +
            '<td data-testid="order-items-' + escapeHtml(o.orderNumber) + '"><div class="order-items-summary">' + itemsSummary + '</div></td>' +
            '<td data-testid="order-total-' + escapeHtml(o.orderNumber) + '">' + formatMoney(o.total) + discountNote + '</td>' +
          '</tr>';
      }).join("");

      body = '<div class="order-table-wrap"><table class="order-table"><thead><tr>' + headHtml + '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';
    }

    return "" +
      renderHeader() +
      '<main>' +
        '<h1 class="page-title">Order history</h1>' +
        '<p class="page-subtitle">Orders placed this session. Click a column to sort.</p>' +
        body +
      '</main>';
  }

  function bindOrderHistory() {}

  root().addEventListener("click", appClickHandler);
  render();
})();
</script>
</body>
</html>
